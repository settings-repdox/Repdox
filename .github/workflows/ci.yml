name: CI

# Runs on every push/PR to main. This is the fix for a real failure mode:
# a local merge can silently revert someone else's fix (see the git
# history around commit cace1eb for a concrete example — a merge
# conflict resolution quietly undid a bug fix, and nothing caught it
# until the next deploy). Without this workflow, the only thing
# standing between a bad merge and production was someone remembering
# to run `npm test`/`npm run typecheck`/`npm run build` by hand first.
#
# See docs/architecture/PHASE11_COMPLIANCE_REPORT.md and RFC 0002
# (docs/rfc/rfc-0002-ci-and-e2e-seed-environment.md) for the fuller
# writeup. The E2E job below requires E2E_SUPABASE_URL (repo variable)
# and E2E_SUPABASE_ANON_KEY / E2E_SUPABASE_SERVICE_ROLE_KEY (repo
# secrets) pointing at a Supabase project dedicated to E2E testing —
# it's skipped, not failed, when those aren't configured.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- run

      - name: Build
        run: npm run build

  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    # Reported, not required — the codebase has ~270 pre-existing lint
    # errors as of this workflow's introduction (mostly
    # @typescript-eslint/no-explicit-any in api/ routes and test mocks,
    # matching established-if-imperfect conventions documented in
    # docs/architecture/PHASE11_COMPLIANCE_REPORT.md). Making this a
    # required check today would fail on every PR for reasons the PR
    # author didn't cause, which teaches people to ignore CI rather than
    # trust it. Flip `continue-on-error` to `false` once that backlog is
    # actually cleared, at which point this becomes a real regression
    # gate instead of a status report.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Requires repository secrets pointing at a dedicated E2E Supabase
    # project (never production) - see scripts/seed-e2e-data.ts and
    # docs/rfc/rfc-0002-ci-and-e2e-seed-environment.md for the full
    # writeup, and docs/adr/ for the ADR once this is converted. Skips
    # cleanly (rather than failing) when those secrets aren't configured,
    # so this doesn't break CI for forks/PRs that can't access repo
    # secrets.
    if: ${{ vars.E2E_SUPABASE_URL != '' }}
    env:
      VITE_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_GAMING_EVENT_SLUG: e2e-gaming-fixture
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Seed E2E fixture data
        run: npm run seed:e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
